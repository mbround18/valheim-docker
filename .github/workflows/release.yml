name: Release

# Replaces the Intuit `auto` release train and the separate Docker Release workflow with
# paws: version from the merged PR's labels, tag + GitHub Release, changelog, binaries,
# then images, all in one run so nothing depends on a release event re-triggering CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, changelog & binaries
    # The changelog commit carries [skip ci]; don't release it again.
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'ci skip')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    env:
      # A token that may push to main (the changelog commit) and whose release/tag writes
      # count as a real user, as `auto` used before.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mbround18/paws/actions/paws-up@main
      # Bump from the merged PR's major/minor/patch label, then tag + GitHub Release.
      - name: Tag and GitHub Release
        id: semver
        run: echo "version=$(paws semver --push | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Changelog
        run: paws changelog --version "${{ steps.semver.outputs.version }}" --commit
      - name: Release binaries
        run: >-
          paws release --local-build
          --target x86_64-unknown-linux-gnu
          --package odin,huginn --binary-name odin,huginn
          --tag "${{ steps.semver.outputs.version }}"

  images:
    name: Publish ${{ matrix.image }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [odin, valheim]
    steps:
      - uses: actions/checkout@v6
      - uses: mbround18/paws/actions/paws-up@main
      # Docker Hub and GHCR: :<version>, :latest, :<major> and :<major>.<minor>, :sha-<sha>.
      - name: paws docker
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: >-
          paws docker
          --image "mbround18/${{ matrix.image }}"
          --target "${{ matrix.image }}"
          --version "${{ needs.release.outputs.version }}"
          --registries ghcr.io
          --dockerhub-username mbround18
          --ghcr-username mbround18
          --with-latest --tag-rollup --tag-sha

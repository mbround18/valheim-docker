name: Release

# Replaces the Intuit `auto` release train with paws: version from the merged PR's labels,
# tag + GitHub Release, changelog, then binaries. Images are published by images.yml when
# the tag pushed here arrives, so that `paws docker` sees a real release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, changelog & binaries
    # The changelog commit carries a CI-skip marker; don't release it again.
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'ci skip')"
    runs-on: ubuntu-latest
    env:
      # A personal token, as `auto` used, so it can push the changelog commit to main.
      # It is also what starts images.yml: GitHub doesn't run workflows for a tag pushed
      # with the built-in GITHUB_TOKEN, only for one pushed with a personal token.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mbround18/paws/actions/paws-up@v0.0.1-prerelease.47
        with:
          version: v0.0.1-prerelease.47
      # Bump from the merged PR's major/minor/patch label, then tag + GitHub Release.
      - name: Tag and GitHub Release
        id: semver
        run: echo "version=$(paws semver --push | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Changelog
        run: paws changelog --version "${{ steps.semver.outputs.version }}" --commit
      - name: Release binaries
        run: >-
          paws release --local-build
          --target x86_64-unknown-linux-gnu
          --package odin,huginn --binary-name odin,huginn
          --tag "${{ steps.semver.outputs.version }}"

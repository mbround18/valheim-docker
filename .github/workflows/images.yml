name: Publish Images

# Runs on the version tag release.yml pushes (or manually, against a tag). `paws docker`
# only adds `:latest` and the `:<major>` / `:<major>.<minor>` rollups on a tag build
# (GITHUB_REF=refs/tags/...), so publishing from the push to main would skip them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish ${{ matrix.image }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [odin, valheim]
    steps:
      - uses: actions/checkout@v6
      - uses: mbround18/paws/actions/paws-up@v0.0.1-prerelease.46
        with:
          version: v0.0.1-prerelease.46
      # Docker Hub and GHCR: :<major>.<minor>.<patch>, :<major>.<minor>, :<major> and
      # :latest, with no `v` (--no-prefix), matching the tags published before paws.
      - name: paws docker
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: >-
          paws docker
          --image "mbround18/${{ matrix.image }}"
          --target "${{ matrix.image }}"
          --version "${{ github.ref_name }}"
          --registries ghcr.io
          --dockerhub-username mbround18
          --ghcr-username mbround18
          --no-prefix --with-latest --tag-rollup

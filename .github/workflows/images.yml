name: Publish Images

# Runs on the version tag release.yml pushes (or manually, against a tag). `paws docker`
# only adds `:latest` and the `:<major>` / `:<major>.<minor>` rollups on a tag build
# (GITHUB_REF=refs/tags/...), so publishing from the push to main would skip them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: mbround18/paws/actions/paws-up@v0.0.1-prerelease.46
        with:
          version: v0.0.1-prerelease.46
      # One job for both images, one after the other on the same Dagger engine. The
      # Dockerfile compiles odin and huginn once, in odin-builder, and valheim copies them
      # from the odin stage, so the valheim build reuses the layers the odin build just
      # made. Separate jobs would each compile the Rust workspace from scratch.
      #
      # Tags, on Docker Hub and GHCR: :<major>.<minor>.<patch>, :<major>.<minor>, :<major>
      # and :latest, with no `v` (--no-prefix), matching the tags published before paws.
      - name: Publish odin
        run: >-
          paws docker
          --image mbround18/odin --target odin
          --version "${{ github.ref_name }}"
          --registries ghcr.io
          --dockerhub-username mbround18 --ghcr-username mbround18
          --no-prefix --with-latest --tag-rollup
      # No Actions cache restore/save for the second image: see ci.yml's Docker job for why.
      # The engine stays up between steps, so valheim still reuses odin's layers.
      - name: Publish valheim
        run: >-
          env -u ACTIONS_RUNTIME_TOKEN
          paws docker
          --image mbround18/valheim --target valheim
          --version "${{ github.ref_name }}"
          --registries ghcr.io
          --dockerhub-username mbround18 --ghcr-username mbround18
          --no-prefix --with-latest --tag-rollup

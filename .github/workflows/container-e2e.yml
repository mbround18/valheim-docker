name: Container E2E

# Boots the valheim image for real, which downloads the ~2 GB dedicated server, so it only
# runs on demand: manually, or on a pull request labelled `e2e`.
on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Container end-to-end
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build valheim image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          target: valheim
          load: true
          push: false
          tags: valheim-docker:e2e
          cache-from: type=registry,ref=mbround18/valheim:buildcache

      - name: Check image permissions
        run: bash ./.github/scripts/check-image-permissions.sh valheim-docker:e2e

      - name: Container end-to-end
        run: bash ./.github/scripts/e2e-container.sh valheim-docker:e2e
